<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Price Tracker{% endblock %}</title>
  <style>
    /* Palette: validated categorical slots 1-3, with their own dark steps. */
    :root {
      color-scheme: light;
      --surface: #fcfcfb;
      --surface-2: #ffffff;
      --surface-3: #f2f1ee;
      --border: #e2e1dd;
      --text: #0b0b0b;
      --text-2: #52514e;
      --muted: #85837c;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #85837c;
      --good: #0ca30c;
      --critical: #d03b3b;
      --warning: #fab219;
      --accent: #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --surface: #1a1a19;
        --surface-2: #232322;
        --surface-3: #2b2b29;
        --border: #383835;
        --text: #ffffff;
        --text-2: #c3c2b7;
        --muted: #94938b;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-4: #94938b;
        --accent: #3987e5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--surface); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    a { color: var(--accent); }
    header.top {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface-2);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-weight: 700; letter-spacing: -.01em; margin-right: 4px; }
    nav { display: flex; gap: 16px; flex: 1; }
    nav a { color: var(--text-2); text-decoration: none; font-weight: 500; padding: 4px 0; }
    nav a:hover, nav a.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
    h2 { font-size: 15px; margin: 32px 0 12px; color: var(--text-2);
         text-transform: uppercase; letter-spacing: .07em; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

    .card { background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 10px; padding: 16px 18px; }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .card h3 { margin: 0 0 2px; font-size: 16px; }
    .card h3 a { color: var(--text); text-decoration: none; }
    .card h3 a:hover { color: var(--accent); }
    .price { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    .price.hit { color: var(--good); }

    .btn { display: inline-block; background: var(--text); color: var(--surface);
           border: 1px solid var(--text); border-radius: 7px; padding: 8px 14px;
           font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
    .btn:hover { opacity: .88; }
    .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn.danger { background: transparent; color: var(--critical); border-color: var(--border); }
    .btn.small { padding: 5px 10px; font-size: 13px; }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit;
                    background: var(--surface); color: var(--text);
                    border: 1px solid var(--border); border-radius: 7px; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .field { margin-bottom: 14px; }
    .grid2 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    .grid3 { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
    .check { display: flex; align-items: center; gap: 8px; }
    .check input { width: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; }
    td { padding: 7px 10px 7px 0; border-top: 1px solid var(--border); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll { overflow-x: auto; }

    .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px;
           border-radius: 20px; background: var(--surface-3); color: var(--text-2); }
    .tag.ok { color: var(--good); }
    .tag.bad { color: var(--critical); }
    .tag.warn { color: #8a5a12; }

    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px;
             background: var(--surface-3); border: 1px solid var(--border); }
    .flash.bad { border-color: var(--critical); color: var(--critical); }

    .chart { width: 100%; height: auto; }
    .chart .grid { stroke: var(--border); stroke-width: 1; }
    .chart .target { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .chart .axis { font-size: 11px; fill: var(--muted); }
    .chart .target-label { text-anchor: start; }
    .chart .series-label { font-size: 12px; font-weight: 600; fill: var(--text-2); }
    .spark { display: block; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; }

    .job { font-size: 14px; padding: 10px 14px; border-radius: 8px;
           background: var(--surface-3); border: 1px solid var(--border); margin-top: 12px; }
    .job pre { margin: 8px 0 0; font-size: 12px; white-space: pre-wrap; color: var(--text-2); }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    @media (max-width: 640px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">Price Tracker</span>
    <nav>
      <a href="/" class="{{ 'on' if page == 'dashboard' }}">Items</a>
      <a href="/events" class="{{ 'on' if page == 'events' }}">Events</a>
      <a href="/settings" class="{{ 'on' if page == 'settings' }}">Settings</a>
    </nav>
    {% if git.is_repo and git.needs_push %}
      <form method="post" action="/git/push">
        <button class="btn small" type="submit">
          Push {{ git.dirty_files|length }} change{{ '' if git.dirty_files|length == 1 else 's' }}
        </button>
      </form>
    {% endif %}
  </header>
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if flash_error %}<div class="flash bad">{{ flash_error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Two small behaviours, hand-rolled rather than pulled from a CDN so the
    // app works with no internet connection.

    // Post a form and drop the returned HTML fragment into a target element.
    async function postInto(form, targetId, busyText) {
      const target = document.getElementById(targetId);
      target.innerHTML = '<div class="job">' + (busyText || 'Working&hellip;') + '</div>';
      try {
        const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
        target.innerHTML = await response.text();
        const poll = target.querySelector('[data-poll]');
        if (poll) pollJob(poll.dataset.poll, targetId);
      } catch (err) {
        target.innerHTML = '<div class="job">Request failed: ' + err + '</div>';
      }
      return false;
    }

    // Follow a background check until it reports done.
    async function pollJob(jobId, targetId) {
      const target = document.getElementById(targetId);
      for (let i = 0; i < 600; i++) {
        await new Promise(r => setTimeout(r, 1000));
        const response = await fetch('/jobs/' + jobId);
        target.innerHTML = await response.text();
        if (!target.querySelector('[data-poll]')) return;
      }
    }

    document.addEventListener('submit', function (event) {
      const form = event.target;
      if (form.dataset.into) {
        event.preventDefault();
        postInto(form, form.dataset.into, form.dataset.busy);
      }
    });
  </script>
</body>
</html>
