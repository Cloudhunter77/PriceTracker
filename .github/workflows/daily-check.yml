name: Daily price check

on:
  schedule:
    # 07:15 UTC daily. Deliberately not on the hour: scheduled workflows are
    # queued at peak times and GitHub delays them.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check prices without recording or emailing"
        type: boolean
        default: false

# Never let two runs write history at the same time.
concurrency:
  group: price-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check prices
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: |
          uv run pricetracker check ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated price history
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          if [ ! -d data ]; then
            echo "No data directory — the check did not get far enough to record anything."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # data/debug/ is git-ignored
          if git diff --staged --quiet; then
            echo "No new price data to commit."
            exit 0
          fi
          git commit -m "chore: record price check $(date -u +%Y-%m-%d) [skip ci]"
          # Another run may have pushed while we were fetching pages.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed, rebasing and retrying ($attempt/3)..."
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "Could not push price history after 3 attempts." >&2
          exit 1

      - name: Upload pages that could not be parsed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unparsed-pages
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 7
