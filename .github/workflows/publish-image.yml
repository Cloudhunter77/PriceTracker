name: Publish image

# Builds the container and pushes it to GitHub Container Registry, so the
# TrueNAS server pulls a ready-made image instead of needing a source checkout
# and a build toolchain.
#
# This also means the Dockerfile is built and proven on every push. It was
# committed unverified because the environment it was written in cannot reach
# Docker Hub; here it gets a real build every time.

on:
  push:
    branches: ["claude/shopping-price-tracker-s3lu02", "main"]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute the image name
        # Registry paths must be lowercase; GitHub owner names need not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pricetracker" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image it just built
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} pricetracker --help
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} pricetracker schedule --help

      - name: Prove Chromium runs as the unprivileged user the NAS uses
        # Not "does the binary exist" — the failure mode that actually bites is
        # uid 568 being unable to read the browser or write its profile, which
        # only shows up when it runs as that user against a bind mount.
        run: |
          mkdir -p smoke && chmod 777 smoke
          cat > smoke/page.html <<'HTML'
          <html><head><script type="application/ld+json">
          {"@context":"https://schema.org","@type":"Product","name":"Smoke",
           "offers":{"@type":"Offer","price":"123","priceCurrency":"HUF"}}
          </script></head><body>ok</body></html>
          HTML
          docker run --rm --user 568:568 -v "$PWD/smoke:/config" \
            ${{ env.IMAGE }}:${{ github.sha }} python -c "
          from pricetracker.extract import extract_price
          from pricetracker.fetch import BrowserFetcher
          with BrowserFetcher() as browser:
              page = browser.fetch('file:///config/page.html')
          found = extract_price(page.html)
          assert str(found.price) == '123', found
          print('chromium ok, read', found.price, found.currency)
          "
          test -d smoke/data/browser || (echo "browser profile was not written"; exit 1)
