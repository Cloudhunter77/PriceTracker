# What to watch, and when to shout about it.
#
# Only shops that are actually reachable are listed here. Verified from the
# TrueNAS server on 2026-08-27:
#   works:   tripont.hu, emag.hu, edigital.hu, ipon.hu
#   blocked: alza.hu, arukereso.hu, mediamarkt.hu, bhphotovideo.com (403 —
#            TLS fingerprinting, no User-Agent fixes it)
#
# Before adding a shop, test it: the UI's "Test this URL" button, or
#   pricetracker test-url <url>

defaults:
  currency: HUF
  cooldown_days: 3       # after alerting, stay quiet this long unless it drops further
  drop_alert_pct: 10     # also alert on a drop this far below the recent median
  alert_on_out_of_stock: false

items:
  - name: Sony A7 IV váz
    # Seen at 748 999 Ft (Tripont) and 849 900 Ft (eMAG) on 2026-08-27.
    # Set below the best price you've seen, or you'll be alerted immediately.
    target_price: 700000
    currency: HUF
    # To watch a shop that prices in euros, give it its own target. Prices are
    # never converted, so a euro shop is judged against this number and a forint
    # shop against target_price above. Without it, a EUR page is an error.
    # targets:
    #   EUR: 1800
    sources:
      - url: https://www.tripont.hu/tukor-nelkuli-fenykepezogepek/sony-alpha-7-iv-milc-fenykepezogep-vaz-376751-p376751.html
      - url: https://www.emag.hu/sony-alpha-7-iv-full-frame-hibrid-kamera-vaz-fekete-ilce7m4b-cec/pd/DYBBZXMBM/
