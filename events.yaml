# What counts as an interesting event, and where to look for it.
#
# Add or test a source in the web UI (pricetracker ui), or from the terminal:
#   pricetracker events test-source https://example.hu/programok
#
# IMPORTANT: the sources below are a starting point, NOT verified working.
# Whether a site can be read depends on it publishing schema.org Event data.
# Run test-source on each one, delete the ones that come back empty, and look
# for a calendar (.ics) feed instead — those are the most reliable of all.

home:
  label: Budapest
  lat: 47.4979
  lon: 19.0402
  radius_km: 15

window_days: 30       # how far ahead to look
geocode: true         # resolve venue addresses to coordinates via OpenStreetMap
max_per_email: 25     # cap on events in a single digest

interests:
  - name: Live music
    keywords:
      [koncert, concert, gig, live, élő, dj, zenekar, band, jazz, techno, fesztivál, festival]

  - name: Tech
    keywords:
      [meetup, hackathon, developer, fejlesztő, python, javascript, konferencia,
       conference, workshop, startup, AI]

  - name: Food & markets
    keywords:
      [piac, market, street food, vásár, gasztro, food, bor, wine, sör, craft beer, pop-up]

  - name: Culture
    keywords:
      [színház, theatre, theater, kiállítás, exhibition, premier, vetítés, screening,
       film, mozi, tárlat, galéria, gallery, múzeum, museum]

sources:
  # Verified from the TrueNAS server on 2026-08-27.
  #
  # Listing pages carry no event markup — Google asks for it on each event's
  # own page, so that is where these sites put it. `follow` makes the listing
  # an index: links containing that path fragment get visited and read.
  # Each link is a separate throttled request, so max_links keeps the daily
  # run to about a minute per source.
  - name: We Love Budapest
    type: schemaorg
    url: https://welovebudapest.com/programok/
    follow: /program/
    max_links: 40

  # Blocked or empty when tested, kept here so they aren't re-added by mistake:
  #   port.hu, a38.hu       - 200 but zero structured data (JavaScript-rendered)
  #   funzine.hu            - 200, no Event markup on listings; detail pages untested
  #   songkick.com          - HTTP 406
  #   bandsintown.com       - HTTP 403
  #
  # A venue's calendar feed, if you find one, is the most reliable source of all:
  # - name: Trafó
  #   type: ics
  #   url: https://example.hu/events.ics
